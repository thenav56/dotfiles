onboarding = false

[theme]
name = "gruvbox"
auto_switch = true
light_name = "gruvbox-light"
dark_name = "gruvbox"

[ui.toast]
delivery = "terminal"
delay_seconds = 2

[ui]
show_agent_labels_on_pane_borders = true

[keys]
previous_agent = "prefix+,"
next_agent = "prefix+."
previous_workspace = "prefix+<"
next_workspace = "prefix+>"
