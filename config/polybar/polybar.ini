include-file = ~/.dotfiles/config/polybar/polybar-base.ini

[bar/top]
inherit = bar-base

modules-right = brightness sep fs-root sep fs-encrypted sep fs-harddisk sep pulseaudio sep memory sep cpu temperature sep wlan sep eth sep date sep dunst-snooze sep tray

# Machine-specific mount
[module/fs-harddisk]
inherit = fs-base
mount-0 = /mnt/nav-data
format-mounted-prefix = "󰋊 "
format-warn-prefix = "󰋊 "
label-unmounted = 󰋊 

; vim:ft=dosini
