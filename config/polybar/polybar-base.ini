# Generated by scripts/gen-colors.sh from the active base16 theme
# (run by launch_polybar.sh and base16/shell-hooks/polybar.sh).
include-file = ~/.config/polybar/colors.ini

# NOTE: polybar only resolves ${...} when it is the whole value, so inline
# %{F${colors.x}} tags don't work -- use *-foreground / *-prefix-foreground.
[colors]
; base16 roles
background = ${theme.background}
background-alt = ${base16.base01}
selection = ${theme.selection}
disabled = ${theme.disabled}
foreground-dim = ${theme.foreground-dim}
foreground = ${base16.base05}
red = ${base16.base08}
orange = ${base16.base09}
yellow = ${base16.base0A}
green = ${base16.base0B}
cyan = ${base16.base0C}
blue = ${base16.base0D}
magenta = ${base16.base0E}

; semantics
primary = ${colors.yellow}
ok = ${colors.green}
warn = ${colors.orange}
alert = ${colors.red}

; icon groups
sys = ${colors.magenta}
storage = ${colors.cyan}
net = ${colors.blue}
media = ${colors.green}
time = ${colors.yellow}

[bar-base]
width = 100%
height = 21pt
radius = 6
monitor = ${env:MONITOR:}

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt

border-size = 0.5pt
; Gap above the bar. offset-y is ignored: i3 positions dock windows itself,
; so pad with a transparent border inside the window instead.
border-top-size = 3pt
border-color = #00000000

padding-left = 1
padding-right = 1
# No global separator: modules lists use the `sep` module instead, so pairs
# like `cpu temperature` can sit together without one. Spacing comes from sep.
module-margin = 0

font-0 = "CaskaydiaCove Nerd Font:pixelsize=9;1"
font-1 = "CaskaydiaCove Nerd Font:size=10:weight=bold;2"
font-2 = "CaskaydiaCove Nerd Font:size=10;1"

modules-left = i3 sep-i3 xwindow
modules-right = fs-root sep fs-encrypted sep pulseaudio sep memory sep cpu temperature sep wlan sep eth sep date

cursor-click = pointer
cursor-scroll = ns-resize

enable-ipc = true
bottom = false

[module/sep]
type = custom/text
format = <label>
label = ·
label-foreground = ${colors.foreground-dim}
label-padding = 1

# After i3: workspace labels already pad 1 on the right
[module/sep-i3]
inherit = module/sep
label-padding-left = 0

[module/xwindow]
type = internal/xwindow
label = %title:0:70:...%
label-foreground = ${colors.foreground-dim}

[fs-base]
type = internal/fs
interval = 25
fixed-values = true
warn-percentage = 85

format-mounted = <label-mounted>
format-mounted-prefix-foreground = ${colors.storage}
label-mounted = %percentage_used%%

# Warn = red bold + underline (same style as focused i3 workspace)
format-warn = <label-warn>
format-warn-underline = ${colors.alert}
format-warn-prefix-foreground = ${colors.alert}
label-warn = %percentage_used%%
label-warn-foreground = ${colors.alert}
label-warn-font = 2

label-unmounted-foreground = ${colors.alert}

[module/fs-root]
inherit = fs-base
mount-0 = /
format-mounted-prefix = " "
format-warn-prefix = " "
label-unmounted =  

[module/fs-encrypted]
inherit = fs-base
mount-0 = /mnt/encrypted_data
format-mounted-prefix = "󰉐 "
format-warn-prefix = "󰉐 "
label-unmounted = 󰉐 

[module/pulseaudio]
type = internal/pulseaudio

format-volume = <label-volume>
format-volume-prefix = "󰕾 "
format-volume-prefix-foreground = ${colors.media}
label-volume = %percentage%%

format-muted = <label-muted>
format-muted-prefix = "󰝟 "
format-muted-prefix-foreground = ${colors.warn}
label-muted = muted
label-muted-foreground = ${colors.disabled}

[module/memory]
type = internal/memory
interval = 2
warn-percentage = 85

format-prefix = " "
format-prefix-foreground = ${colors.sys}
label = %percentage_used:2%%
# label = R:%percentage_used:2%% (%percentage_swap_used:2%%)

format-warn = <label-warn>
format-warn-prefix = " "
format-warn-underline = ${colors.alert}
format-warn-prefix-foreground = ${colors.alert}
label-warn = %percentage_used:2%%
label-warn-foreground = ${colors.alert}
label-warn-font = 2

[module/cpu]
type = internal/cpu
interval = 2
warn-percentage = 90

format-prefix = " "
format-prefix-foreground = ${colors.sys}
label = %percentage:2%%

format-warn = <label-warn>
format-warn-prefix = " "
format-warn-underline = ${colors.alert}
format-warn-prefix-foreground = ${colors.alert}
label-warn = %percentage:2%%
label-warn-foreground = ${colors.alert}
label-warn-font = 2

[network-base]
type = internal/network
interval = 5
speed-unit =
format-connected = <label-connected>
format-disconnected = <label-disconnected>

[module/wlan]
inherit = network-base
interface-type = wireless
format-connected = <ramp-signal> <label-connected>
label-connected = %local_ip%
label-disconnected = 󰖪
label-disconnected-foreground = ${colors.alert}

ramp-signal-0 = 󰤯
ramp-signal-0-foreground = ${colors.alert}
ramp-signal-1 = 󰤟
ramp-signal-1-foreground = ${colors.warn}
ramp-signal-2 = 󰤢
ramp-signal-2-foreground = ${colors.yellow}
ramp-signal-3 = 󰤥
ramp-signal-3-foreground = ${colors.net}
ramp-signal-4 = 󰤨
ramp-signal-4-foreground = ${colors.net}

[module/eth]
inherit = network-base
interface-type = wired
format-connected-prefix = "󰈀 "
format-connected-prefix-foreground = ${colors.net}
label-connected = %local_ip%
label-disconnected = 󰈂 disconnected
label-disconnected-foreground = ${colors.disabled}

[module/date]
type = internal/date
interval = 1

# Click toggles full timestamp
date = %a %d %b %I:%M%p
date-alt = %Y-%m-%d %H:%M:%S

label = %date%
label-foreground = ${colors.time}

[module/i3]
# https://github.com/polybar/polybar/wiki/Module:-i3
type = internal/i3
show-urgent = true
format = <label-state> <label-mode>
pin-workspaces = true

label-mode = %mode%
label-mode-background = ${colors.warn}
label-mode-foreground = ${colors.background}
label-mode-padding = 1

label-focused = %index%
label-focused-background = ${colors.selection}
label-focused-foreground = ${colors.foreground}
label-focused-underline = ${colors.primary}
label-focused-padding = 1

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-underline = ${colors.disabled}
label-visible-padding = 1

label-unfocused = %index%
label-unfocused-foreground = ${colors.foreground-dim}
label-unfocused-padding = 1

label-urgent = %index%
label-urgent-background = ${colors.alert}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1

[module/temperature]
type = internal/temperature
interval = 1
base-temperature = 40
warn-temperature = 80
# Set by launch_polybar.sh (coretemp/k10temp); empty -> falls back to thermal-zone 0
hwmon-path = ${env:CPU_TEMP_PATH:}

# Sits right after cpu (no sep); offset = small gap
format = <ramp> <label>
format-offset = 5
label = %temperature-c%
format-warn = <ramp> <label-warn>
format-warn-offset = 5
format-warn-underline = ${colors.alert}
label-warn = %temperature-c%
label-warn-foreground = ${colors.alert}
label-warn-font = 2

ramp-0 = 󱩱
ramp-0-foreground = ${colors.cyan}
ramp-1 = 
ramp-1-foreground = ${colors.green}
ramp-2 = 
ramp-2-foreground = ${colors.yellow}
ramp-3 = 
ramp-3-foreground = ${colors.orange}
ramp-4 = 
ramp-4-foreground = ${colors.red}

[module/brightness]
type = custom/ipc
hook-0 = cat /tmp/monitor-screen-brightness-monitor-brightness-current || echo 'N/A'
initial = 1
format = <output>
format-prefix = " "
format-prefix-foreground = ${colors.yellow}

[module/dunst-snooze]
type = custom/ipc
hook-0 = ~/.dotfiles/config/polybar/scripts/dunst-snooze.sh
initial = 1
interval = 10
click-left = ~/.dotfiles/config/polybar/scripts/dunst-snooze.sh --toggle &

[module/tray]
# Polybar 3.7 tray module: icons draw inside the bar, so they share its
# translucent background/blur and line up with the text (legacy tray-position
# used a separate unblurred window).
type = internal/tray
tray-size = 50%
tray-spacing = 6px

[settings]
screenchange-reload = true
# Real ARGB transparency via picom; pseudo mode paints the wallpaper itself
# and makes the window opaque, which defeats picom's blur.
pseudo-transparency = false

; vim:ft=dosini
