include kitty-base.conf

# Override `kitten choose-fonts`
font_family      family='Cascadia Code' style=Light
italic_font      auto
bold_font        auto
bold_italic_font auto

font_size 14.5
single_window_margin_width 5
single_window_padding_width 5
tab_bar_style slant
tab_title_template {"X " if layout_name == "stack" else ""}{title}
tab_title_template "{bell_symbol}{activity_symbol}{'  ' if layout_name == 'stack' and num_windows > 1 else ''}{fmt.fg.tab}{index}. {title}"

modify_font cell_height 4

enabled_layouts splits:split_axis=vertical,stack

map cmd+e layout_action rotate

# Move the active window in the indicated direction
map cmd+shift+k move_window up
map cmd+shift+h move_window left
map cmd+shift+l move_window right
map cmd+shift+j move_window down

# Move the active window to the indicated screen edge
map ctrl+shift+k layout_action move_to_screen_edge top
map ctrl+shift+h layout_action move_to_screen_edge left
map ctrl+shift+l layout_action move_to_screen_edge right
map ctrl+shift+j layout_action move_to_screen_edge bottom

# Switch focus to the neighboring window in the indicated direction
map cmd+k neighboring_window up
map cmd+h neighboring_window left
map cmd+l neighboring_window right
map cmd+j neighboring_window down

# New windows/tabs
map cmd+enter new_window_with_cwd
map cmd+w close_window_with_confirmation
map cmd+t new_tab_with_cwd !neighbor
map cmd+shift+t new_tab !neighbor

# Resize custom hotkeys
map --new-mode resize cmd+f1>r
map cmd+r combine : push_keyboard_mode resize : set_tab_title 🟡 RESIZE ⌞⌝

map --mode resize r resize_window reset
map --mode resize h resize_window narrower 4
map --mode resize l resize_window wider 4
map --mode resize k resize_window taller 4
map --mode resize j resize_window shorter 4
map --mode resize esc combine : pop_keyboard_mode : set_tab_title ""
map --mode resize enter combine : pop_keyboard_mode : set_tab_title ""

# zoom
map cmd+z toggle_layout stack

# Custom overrides - This needs to be called at last
# Not needed for MacOS
include base16_hooks.conf
