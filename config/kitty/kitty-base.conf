placement_strategy top-left

modify_font cell_height +2px

enable_audio_bell no

hide_window_decorations yes

tab_bar_style powerline
tab_bar_edge top
tab_powerline_style slanted

map ctrl+shift+t new_os_window_with_cwd
map cmd+t new_tab_with_cwd

map ctrl+shift+equal change_font_size current +2.0
map ctrl+shift+plus change_font_size current +2.0
map ctrl+shift+minus change_font_size current -2.0
map ctrl+0 change_font_size current 0
map ctrl+shift+kp_subtract change_font_size current -2.0

map ctrl+shift+h no_op
map ctrl+shift+l      launch --location=hsplit --allow-remote-control kitty +kitten search.py @active-kitty-window-id

allow_remote_control socket-only
shell_integration enabled
listen_on unix:/tmp/kitty.sock

# kitty-scrollback.nvim Kitten alias
action_alias kitty_scrollback_nvim kitten /Users/thenav56/.local/share/nvim/lazy/kitty-scrollback.nvim/python/kitty_scrollback_nvim.py
# Browse scrollback buffer in nvim
map ctrl+shift+h kitty_scrollback_nvim
# Browse output of the last shell command in nvim
map ctrl+shift+g kitty_scrollback_nvim --config ksb_builtin_last_cmd_output
