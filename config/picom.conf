#################################
#          Backend              #
#################################

backend = "glx";
vsync = true;

#################################
#        Shadow Settings        #
#################################

shadow = false;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.3;
shadow-exclude = [
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#         Fading                #
#################################

fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
no-fading-openclose = false;

#################################
#         Transparency          #
#################################

# Keep windows fully opaque -- any transparency makes text render over
# the backdrop and visibly softens it on a ~93 DPI panel. Polybar is the
# exception: its translucent background is blurred (docks only, see below).
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
blur-background = true;

#################################
#             Blur              #
#################################

# Blur is scoped to docks (polybar) only; everything else is excluded so
# windows stay crisp. "box" is the cheapest kernel; dual_kawase looks far better.
blur-method = "dual_kawase";
blur-strength = 5;
blur-background-exclude = [
  "window_type != 'dock'"
];

#################################
#         Window Types          #
#################################

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 1.0; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};

#################################
#       Performance Tweaks      #
#################################

use-damage = true;
unredir-if-possible = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
