#################################
#          Backend              #
#################################

backend = "glx";
vsync = true;

#################################
#        Shadow Settings        #
#################################

shadow = false;
shadow-radius = 12;
shadow-offset-x = -12;
shadow-offset-y = -12;
shadow-opacity = 0.3;
shadow-exclude = [
  "class_g = 'Conky'",
  "class_g ?= 'Notify-osd'",
  "class_g = 'Cairo-clock'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#         Fading                #
#################################

fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
no-fading-openclose = false;

#################################
#         Transparency          #
#################################

inactive-opacity = 0.97;
active-opacity = 1.0;
frame-opacity = 0.9;
inactive-opacity-override = false;
blur-background = true;

#################################
#             Blur              #
#################################

blur-method = "box";
blur-background-exclude = [
  "window_type = 'dock'",
  "class_g = 'Polybar'",
  "class_g = 'slop'",
  "class_g = 'bar'",
  "_GTK_FRAME_EXTENTS@:c"
];

#################################
#         Window Types          #
#################################

wintypes:
{
  tooltip = { fade = true; shadow = true; opacity = 0.9; focus = true; };
  dock = { shadow = false; };
  dnd = { shadow = false; };
  popup_menu = { opacity = 0.95; };
  dropdown_menu = { opacity = 0.95; };
};

#################################
#       Performance Tweaks      #
#################################

use-damage = true;
unredir-if-possible = true;
detect-rounded-corners = true;
detect-client-opacity = true;
detect-transient = true;
detect-client-leader = true;
