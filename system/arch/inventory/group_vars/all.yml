---
# Shared defaults loaded by every play in this inventory.
# Per-user values live in ../local.yml (created from local.yml.example, gitignored).

# DNS resolvers used by the dns role (systemd-resolved).
dns_servers:
  - 1.1.1.1
  - 1.0.0.1

# Whether systemd-resolved should require DNS-over-TLS for the
# configured dns_servers. Override to false in local.yml on hosts where
# outbound port 853 is blocked (some libvirt NATs, corporate proxies).
dns_over_tls: true

# faillock.conf deny count. After this many failed logins the account
# locks for 10 minutes.
faillock_deny: 10

# docker daemon log rotation (passed verbatim into log-opts).
docker_log_opts:
  max-size: "50m"
  max-file: "5"

# GRUB menu countdown seconds.
grub_timeout: 1

# Feature flags — individual scalars so you can flip ONE in local.yml
# without re-listing the rest.
feature_gpu_amd: false
feature_zfs: false
feature_ddcutil: false
feature_docker: true
feature_display_manager: true
feature_swap: false
feature_user_tools: true

# Package-list deltas. Override THESE in local.yml instead of redefining the
# full lists. `_add` appends, `_skip` removes; skip wins on conflict.
packages_native_add:  []
packages_native_skip: []
packages_aur_add:     []
packages_aur_skip:    []
uv_tools_add:         []
uv_tools_skip:        []

# Python tools installed via `uv tool install` by the user-tools role.
# Each entry is passed unquoted to `uv tool install` so prefixes like
# `--with <extra>` work.
uv_tools:
  - neovim-remote
  - --with requests ipython
  - django
  - pre-commit
  - flake8
  - isort
  - ruff
  - line-profiler
  - snakeviz
  - --with openpyxl visidata
  - azure-cli
  - --with requests jupyterlab

# Per-feature uv tools. Merged into the install list by the user-tools
# role only when the matching feature flag is true. Keys must match the
# suffix of the `feature_*` flags above.
feature_uv_tools:
  ddcutil:
    - ddcci_plasmoid_backend

# Per-feature AUR packages. Merged into the AUR install list by the
# pacman-packages role only when the matching feature flag is true.
# Keys must match the suffix of the `feature_*` flags above. Native feature
# packages live inline in each feature role's tasks (they install
# only when the role runs).
feature_aur_packages:
  zfs:
    - zfs-dkms
  ddcutil:
    - ddcci-driver-linux-dkms
  display_manager:
