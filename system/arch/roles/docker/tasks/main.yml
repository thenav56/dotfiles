---
# DOCKER SETUP/CONFIGURATION --------------------------------------------------------------
- name: install docker
  community.general.pacman:
    name:
      - docker
      - docker-compose
      - ctop

- name: add the user to the wheel group
  ansible.builtin.user:
    name: "{{ username }}"
    groups: docker
    append: yes

- name: enable docker
  ansible.builtin.systemd:
    name: docker
    enabled: yes

- name: Create /etc/docker directory if it does not exist
  ansible.builtin.file:
    path: /etc/docker
    state: directory
    mode: '0755'

- name: configure docker daemon log driver and rotation
  ansible.builtin.copy:
    dest: /etc/docker/daemon.json
    content: "{{ {'log-driver': 'json-file', 'log-opts': docker_log_opts} | to_nice_json }}"
  notify: restart docker
