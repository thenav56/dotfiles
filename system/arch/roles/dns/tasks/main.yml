---
- name: Create /etc/systemd/resolved.conf.d directory if it does not exist
  ansible.builtin.file:
    path: /etc/systemd/resolved.conf.d
    state: directory

# DNS configurations - https://wiki.archlinux.org/title/systemd-resolved
- name: systemd-resolved - upstream DNS configuration
  ansible.builtin.copy:
    dest: /etc/systemd/resolved.conf.d/dns_over_tls.conf
    content: |
      [Resolve]
      DNS={{ dns_servers | join(' ') }}
      DNSOverTLS={{ 'yes' if dns_over_tls | bool else 'no' }}
  notify: restart systemd-resolved

- name: systemd-resolved - Create a symbolic link for /etc/resolv.conf
  ansible.builtin.file:
    src: ../run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    force: true
    state: link
  when: ansible_virtualization_type | default('unknown') != 'chroot'

- name: enable systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: true

- name: start systemd-resolved
  ansible.builtin.systemd:
    name: systemd-resolved
    state: started
  when: start_services | bool
