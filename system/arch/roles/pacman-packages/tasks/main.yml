---
# community.general.pacman with upgrade:true is not safely simulatable:
# it reports "changed" in --check even when nothing would actually
# upgrade. Skip in check mode so the idempotency gate is honest; the
# real run still performs upgrades.
- name: Arch Full Update
  become: true
  community.general.pacman:
    update_cache: true
    upgrade: true
  when: not ansible_check_mode

# update_cache was already done by `Arch Full Update` above; running it
# again here makes this task always-changed under --check.
- name: Compose native install list (core + add − skip)
  ansible.builtin.set_fact:
    _native_to_install: >-
      {{ (packages.native + packages_native_add)
         | difference(packages_native_skip) }}

- name: install core packages
  become: true
  community.general.pacman:
    name: '{{ _native_to_install }}'

# AUR ------------------------------------------------------------------------
# Compose the desired AUR list, then install only what's actually
# missing. The whole AUR build apparatus (aur_builder NOPASSWD sudoers
# entry, yay build deps) is stood up ONLY when there's something to
# install — so an already-synced system does zero AUR work and the
# sensitive sudoers entry never appears. Upgrades are intentionally NOT
# handled here: run `yay -Syu` manually when you want to upgrade.
- name: Compose AUR install list (core + add + enabled feature packages − skip)
  ansible.builtin.set_fact:
    _aur_to_install: >-
      {{ ((packages.aur + packages_aur_add)
         + (feature_aur_packages.zfs             | default([]) if feature_zfs             | default(false) else [])
         + (feature_aur_packages.ddcutil         | default([]) if feature_ddcutil         | default(false) else [])
         + (feature_aur_packages.display_manager | default([]) if feature_display_manager | default(false) else []))
         | difference(packages_aur_skip) }}

- name: Query installed packages
  ansible.builtin.command: pacman -Qq
  register: _installed_pkgs
  changed_when: false
  check_mode: false

- name: Determine which AUR packages are missing
  ansible.builtin.set_fact:
    _aur_missing: "{{ _aur_to_install | difference(_installed_pkgs.stdout_lines) }}"

- name: Install missing AUR packages
  when: _aur_missing | length > 0
  block:
    - name: Ensure aur_builder service user exists
      become: true
      ansible.builtin.user:
        name: aur_builder
        create_home: true
        group: wheel
        shell: /usr/bin/nologin
        password: '!'
        system: false
        state: present

    - name: Allow the `aur_builder` user to run `sudo pacman` without a password
      become: true
      ansible.builtin.lineinfile:
        path: /etc/sudoers.d/11-install-aur_builder
        line: 'aur_builder ALL=(ALL) NOPASSWD: /usr/bin/pacman'
        create: true
        mode: '0644'
        validate: 'visudo -cf %s'

    - name: Install yay build packages
      become: true
      community.general.pacman:
        name:
          - git
          - base-devel

    - name: Install yay using makepkg if it isn't installed already
      kewlfft.aur.aur:
        name: yay-bin
        use: makepkg
        state: present
        aur_only: true
      become: true
      become_user: aur_builder

    # Best-effort: a single bad PKGBUILD (build OOM, network blip,
    # upstream breakage) should warn, not abort the play — downstream
    # roles still need to run.
    - name: Install missing AUR packages (best-effort)
      block:
        - name: Install packages using yay
          kewlfft.aur.aur:
            use: yay
            name: '{{ _aur_missing }}'
            aur_only: true
          become: true
          become_user: aur_builder
      rescue:
        - name: Record AUR failure for end-of-play warning
          ansible.builtin.set_fact:
            _aur_failed: true
            _aur_failed_list: "{{ _aur_missing }}"

        - name: AUR failure — continuing play, will warn at end
          ansible.builtin.debug:
            msg: >-
              One or more AUR packages failed. Play will continue;
              a summary warning will print at the end.

  always:
    # Tear down per-run state. Both tasks are gated on the same
    # condition as the block so they never fire on a no-op
    # (already-synced) run. aur_builder itself is left in place — it's
    # locked (nologin, password '!') and without the sudoers entry has
    # no privileges, but keeping it preserves the yay build cache.
    # pkill returns 1 when no processes match (the clean case), hence
    # failed_when:false.
    - name: Kill any lingering aur_builder processes
      become: true
      ansible.builtin.command: pkill -KILL -u aur_builder
      register: pkill_result
      failed_when: false
      changed_when: pkill_result.rc == 0
      when: _aur_missing | length > 0

    - name: Remove aur_builder NOPASSWD sudoers entry
      become: true
      ansible.builtin.file:
        path: /etc/sudoers.d/11-install-aur_builder
        state: absent
      when: _aur_missing | length > 0

# End-of-role warning. Runs only when an AUR install failed; uses a
# banner so it doesn't get lost in the recap.
- name: WARNING — AUR install reported failures
  ansible.builtin.debug:
    msg: |
      ============================================================
      WARNING: AUR install had failures
      ============================================================
      One or more AUR packages failed to build/install. Common
      causes: build OOM (heavy Go/Rust builds), transient network
      or keyserver issues, or upstream PKGBUILD breakage.

      Packages attempted in this run:
      {{ _aur_failed_list | default([]) | join('  ') }}

      If a DKMS kernel module is in that list (zfs-dkms,
      ddcci-driver-linux-dkms), the matching feature role may have
      configured a module that is NOT installed — affected modules
      will fail to load on next reboot until you re-run.

      Re-run `ansible-playbook playbooks/system-sync.yml` to retry.
      ============================================================
  when: _aur_failed | default(false)
