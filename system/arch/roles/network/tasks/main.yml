---
# Network configurations -------------------------------------------------
- name: systemd-networkd - Wired
  copy:
    dest: /etc/systemd/network/20-wired.network
    content: |
      [Match]
      Name=en*
      [Network]
      DHCP=yes
      [DHCPv4]
      RouteMetric=100
      [IPv6AcceptRA]

- name: systemd-networkd - Wireless
  copy:
    dest: /etc/systemd/network/25-wireless.network
    content: |
      [Match]
      Name=wlan0
      [Network]
      DHCP=yes
      IgnoreCarrierLoss=3s
      [DHCPv4]
      RouteMetric=200
      [IPv6AcceptRA]
      RouteMetric=200

- name: enable and start systemd-networkd
  systemd:
    name: systemd-networkd
    enabled: yes
    state: started

- name: install iwd
  pacman:
    name:
      - iwd
      - impala

- name: enable and start systemd-networkd
  systemd:
    name: iwd
    enabled: yes
