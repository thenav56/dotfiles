---
# Install & Enable ly
- name: install ly
  community.general.pacman:
    name:
      - ly

- name: Enable ly
  ansible.builtin.systemd:
    name: ly@tty2.service
    enabled: true

# https://github.com/betterlockscreen/betterlockscreen#systemd
- name: enable betterlockscreen
  ansible.builtin.systemd:
    name: "betterlockscreen@{{ username }}"
    enabled: true

- name: start betterlockscreen
  ansible.builtin.systemd:
    name: "betterlockscreen@{{ username }}"
    state: started
  when: start_services | bool
