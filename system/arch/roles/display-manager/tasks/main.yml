---
# Install & Enable ly
- name: install ssh
  pacman:
    name:
      - ly

- name: Enable ly
  systemd:
    name: ly@tty2.service
    enabled: yes

# https://github.com/betterlockscreen/betterlockscreen#systemd
- name: enable betterlockscreen
  systemd:
    name: "betterlockscreen@{{ username }}"
    enabled: yes
    state: started
