---
- name: Amd gpu packages
  hosts: localhost

  tasks:
    # Update cache
    - name: pacman -Sy
      community.general.pacman:
        update_cache: true
        force: true

    - name: install packages
      become: true
      pacman:
        update_cache: yes
        name:
          # AMD packages
          - radeontop
          - vulkan-radeon
          - s-tui
          - mesa-utils
          - lib32-systemd
          # Gaming
          - steam
          - steam-native-runtime
