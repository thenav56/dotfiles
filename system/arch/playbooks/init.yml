# Phase 1 — runs from `arch-chroot /mnt` on the live ISO, as root,
# before the installed system has booted. `systemctl start` doesn't
# work in chroot (no PID 1, partial /proc) so every role imported here
# passes start_services:false; services get enabled only.
---
- name: Archlinux base setup - During install only
  hosts: localhost
  become: true

  vars_files:
    - ../local.yml

  vars_prompt:
    - name: new_password
      prompt: What is your password?
      private: true
      encrypt: sha512_crypt
      confirm: true
      salt_size: 7

  tasks:
    - ansible.builtin.import_role:
        name: bootstrap
      tags: [bootstrap, init-only]

    - ansible.builtin.import_role:
        name: bootloader
      tags: [bootloader, init-only]

    - ansible.builtin.import_role:
        name: users
      tags: [users]

    - ansible.builtin.import_role:
        name: network
      vars:
        start_services: false
      tags: [network]

    - ansible.builtin.import_role:
        name: dns
      vars:
        start_services: false
      tags: [dns]

    - ansible.builtin.import_role:
        name: pacman
      vars:
        start_services: false
      tags: [pacman]
