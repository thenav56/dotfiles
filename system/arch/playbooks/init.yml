# Phase 1 — runs from `arch-chroot /mnt` on the live ISO, as root,
# before the installed system has booted. `systemctl start` doesn't
# work in chroot (no PID 1, partial /proc) so every role imported here
# passes start_services:false; services get enabled only.
---
- name: Archlinux base setup - During install only
  hosts: localhost
  become: true

  vars_prompt:
    - name: new_password
      prompt: What is your password?
      private: true
      encrypt: sha512_crypt
      confirm: true
      salt_size: 7

  pre_tasks:
    - name: Verify local.yml exists
      ansible.builtin.stat:
        path: "{{ playbook_dir }}/../local.yml"
      register: local_yml_stat
      check_mode: false

    - name: Fail clearly when local.yml is missing
      ansible.builtin.assert:
        that: local_yml_stat.stat.exists
        fail_msg: >-
          local.yml missing — run
          `cp local.yml.example local.yml && $EDITOR local.yml`
          from system/arch/ before invoking this playbook.

    - name: Load per-user values from local.yml
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../local.yml"

    - name: Verify local.yml supplies required keys
      ansible.builtin.assert:
        that:
          - username is defined
          - hostname is defined
          - timezone is defined
        fail_msg: >-
          local.yml must define username, hostname, and timezone.

    - name: Warn if init.yml is running outside arch-chroot
      ansible.builtin.debug:
        msg: >-
          ansible_virtualization_type={{ ansible_virtualization_type | default('unknown') }}
          — init.yml is intended to run inside an Arch chroot. Continuing,
          since re-running outside chroot is a valid recovery path.
      when: ansible_virtualization_type | default('unknown') != 'chroot'

  tasks:
    - name: Bootstrap (timezone, locale, hostname)
      ansible.builtin.import_role:
        name: bootstrap
      tags: [bootstrap, init-only]

    - name: Bootloader (grub)
      ansible.builtin.import_role:
        name: bootloader
      tags: [bootloader, init-only]

    - name: Users (create user, sudoers, wheel)
      ansible.builtin.import_role:
        name: users
      tags: [users]

    - name: Network (enable-only in chroot)
      ansible.builtin.import_role:
        name: network
      vars:
        start_services: false
      tags: [network]

    - name: DNS (enable-only in chroot)
      ansible.builtin.import_role:
        name: dns
      vars:
        start_services: false
      tags: [dns]

    - name: Pacman config (enable-only in chroot)
      ansible.builtin.import_role:
        name: pacman
      vars:
        start_services: false
      tags: [pacman]
