---
- name: Archlinux system configuration for AUR tools
  hosts: localhost
  become: true

  vars_prompt:
    - name: username
      prompt: What is your username?
      private: false

  tasks:
    # https://github.com/betterlockscreen/betterlockscreen#systemd
    - name: enable betterlockscreen
      systemd:
        name: "betterlockscreen@{{ username }}"
        enabled: yes
        state: started
